# Tool configuration only (this is an application, not a pip package).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# E/F: errors and undefined names, I: import order, B: likely bugs, S: security checks (bandit)
select = ["E", "F", "I", "B", "S"]
ignore = ["B008"]  # FastAPI's Depends() in default arguments is intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and test passwords are fine in tests
